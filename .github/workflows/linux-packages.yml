name: Linux package rehearsal
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.1
      - name: Packaging regressions
        run: python3 -m unittest scripts/test_linux_packaging.py
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev libclang-dev pkg-config nasm autoconf automake libtool zlib1g-dev libbz2-dev patchelf libfuse2 minisign
      - id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ffmpeg-prefix
          key: ffmpeg-linux-ubuntu22-x64-${{ hashFiles('scripts/build-ffmpeg-linux.sh', 'scripts/build-ffmpeg-macos.sh') }}
      - name: Pinned shared FFmpeg
        run: |
          scripts/build-ffmpeg-linux.sh "$RUNNER_TEMP/ffmpeg-prefix"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg-prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg-prefix/lib" >> "$GITHUB_ENV"
      # Preserve successful codec compilation even if packaging or a smoke check needs a fix.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ffmpeg-prefix
          key: ffmpeg-linux-ubuntu22-x64-${{ hashFiles('scripts/build-ffmpeg-linux.sh', 'scripts/build-ffmpeg-macos.sh') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: linux-package-ubuntu22
          save-if: ${{ !cancelled() }}
      - run: pnpm install --frozen-lockfile
      - name: Build and stage private libraries
        run: |
          pnpm exec tauri build --ci --no-bundle --config .github/tauri/linux-release.conf.json
          scripts/bundle-ffmpeg-linux.sh "$RUNNER_TEMP/ffmpeg-prefix" target/release/unsub
          pnpm exec tauri bundle --ci --bundles appimage,deb --config .github/tauri/linux-release.conf.json
      - name: Audit both package layouts
        run: |
          mkdir -p "$RUNNER_TEMP/deb-audit" "$RUNNER_TEMP/appimage-audit"
          dpkg-deb -x target/release/bundle/deb/*.deb "$RUNNER_TEMP/deb-audit"
          scripts/audit-linux-package.sh "$RUNNER_TEMP/deb-audit"
          image=$(realpath target/release/bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP/appimage-audit" && "$image" --appimage-extract >/dev/null)
          scripts/audit-linux-package.sh "$RUNNER_TEMP/appimage-audit/squashfs-root"
      - name: Version-bound updater signatures
        if: inputs.sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          version=$(jq -r .version src-tauri/tauri.conf.json)
          for artifact in target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb; do
            pnpm exec tauri signer sign --app-version "$version" "$artifact"
          done
          scripts/verify-linux-signatures.sh "$version" target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux
          path: |
            target/release/bundle/appimage/*.AppImage*
            target/release/bundle/deb/*.deb*
            src-tauri/ffmpeg-bundle/linux/licenses/ubuntu-packages.tsv
          if-no-files-found: error
      - name: Preserve packages for failed-audit diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-diagnostics
          path: |
            target/release/bundle/appimage/*.AppImage*
            target/release/bundle/deb/*.deb*
          if-no-files-found: ignore
  smoke:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        distro: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
        package: [appimage, deb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux
          path: artifacts
      - name: Clean distribution install and playback
        env:
          DISTRO: ${{ matrix.distro }}
          PACKAGE: ${{ matrix.package }}
        run: |
          suffix=AppImage; test "$PACKAGE" != deb || suffix=deb
          artifact=$(find artifacts -name "*.$suffix" -print -quit)
          docker run --rm --security-opt seccomp=unconfined -v "$PWD:/workspace:ro" "$DISTRO" bash -c 'cp "$1" "/tmp/$(basename "$1")"; bash /workspace/scripts/linux-package-smoke.sh "$2" "/tmp/$(basename "$1")"' _ "/workspace/$artifact" "$PACKAGE"
