name: CI

# Nothing in the build or the tests reads these paths, so a docs-only change skips the three-platform run.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"

# One key for push and pull_request: head_ref is the PR's branch, ref_name is the pushed branch, so a
# branch with an open PR never runs twice at once, and a newer push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Pinned so that a new stable clippy cannot turn the build red on its own. Bump it on purpose.
  RUST_TOOLCHAIN: 1.93.1
  # vcpkg release 2026.07.29, whose ffmpeg port is 8.1.2 (see scripts/install-ffmpeg-windows.ps1).
  VCPKG_COMMIT: c76c06644034521fb761a39f8f52d8e87d1103d5

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Frontend. Order matters: setup-node's pnpm cache needs pnpm on PATH first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      # tauri-build refuses to compile src-tauri without the frontend's dist folder.
      - run: pnpm exec vite build

      # Rust.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check

      # FFmpeg, per platform. The Rust build links it through ffmpeg-sys-next.
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/ffmpeg-macos
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/ffmpeg-windows
        with:
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}
      - name: FFmpeg and Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The first two lines are Tauri's documented Debian prerequisites; then ALSA for cpal, D-Bus for
          # tao, libclang for bindgen, and the FFmpeg development packages (libmp3lame and libopus come
          # with them).
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast reports every failing test binary in one run.
      - run: cargo test --workspace --no-fail-fast
