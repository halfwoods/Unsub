name: CI

# Nothing in the build or the tests reads these paths, so documentation-only changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# One key for push and pull_request: head_ref is the PR's branch, ref_name is the pushed branch, so a
# branch with an open PR never runs twice at once, and a newer push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Pinned so that a new stable clippy cannot turn the build red on its own. Bump it on purpose.
  RUST_TOOLCHAIN: 1.93.1
  # vcpkg release 2026.07.29, whose ffmpeg port is 8.1.2 (see scripts/install-ffmpeg-windows.ps1).
  VCPKG_COMMIT: c76c06644034521fb761a39f8f52d8e87d1103d5

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            minimum_os: "11.0"
          - name: macOS (Intel, High Sierra target)
            os: macos-15-intel
            minimum_os: "10.13.6"
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Frontend. Order matters: setup-node's pnpm cache needs pnpm on PATH first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node --test src/import/test/*.test.mjs
      - run: node --test src/browser/test/*.test.mjs
      - run: node --test src/visualizer/test/*.test.mjs
      - run: node --test src/compat/test/*.test.mjs
      - run: python3 -m unittest discover -s scripts/test -p 'test_*.py'
      # tauri-build refuses to compile src-tauri without the frontend's dist folder.
      - run: pnpm exec vite build

      # Rust.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ matrix.minimum_os && format('macos-min-{0}', matrix.minimum_os) || '' }}
      - run: cargo fmt --all --check

      # FFmpeg, per platform. The Rust build links it through ffmpeg-sys-next.
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/ffmpeg-macos
        with:
          deployment-target: ${{ matrix.minimum_os }}
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/ffmpeg-windows
        with:
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}
      - name: FFmpeg and Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The first two lines are Tauri's documented Debian prerequisites; then ALSA for cpal, D-Bus for
          # tao, libclang for bindgen, and the FFmpeg development packages (libmp3lame and libopus come
          # with them).
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast reports every failing test binary in one run.
      - run: cargo test --workspace --no-fail-fast
      - name: Native compatibility regressions
        if: runner.os == 'macOS'
        run: |
          cargo test --manifest-path vendor/cpal-0.18.2/Cargo.toml --lib compatibility_tests
          cargo test --manifest-path vendor/security-framework-3.7.0/Cargo.toml --features unsub-legacy-tests --test high_sierra

      # This proves the Intel package targets 10.13 and has no known newer hard imports. It does
      # not replace the manual High Sierra runtime check recorded in the implementation plan.
      - name: Build the Intel compatibility candidate
        if: matrix.minimum_os == '10.13.6'
        run: pnpm exec tauri build --ci --debug --bundles app --config .github/tauri/macos-intel.conf.json --config '{"build":{"beforeBuildCommand":""}}'
      - name: Bundle and audit the Intel compatibility candidate
        if: matrix.minimum_os == '10.13.6'
        env:
          APPLE_SIGNING_IDENTITY: "-"
          ENTITLEMENTS: scripts/entitlements.plist
        run: |
          scripts/bundle-ffmpeg-macos.sh target/debug/bundle/macos/Unsub.app
          python3 scripts/check-macos-compat.py target/debug/bundle/macos/Unsub.app --minimum 10.13.6 --arch x86_64
          ditto -c -k --sequesterRsrc --keepParent target/debug/bundle/macos/Unsub.app "$RUNNER_TEMP/Unsub-High-Sierra-candidate.zip"
      - name: Keep the Intel compatibility candidate
        if: matrix.minimum_os == '10.13.6'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unsub-High-Sierra-candidate
          path: ${{ runner.temp }}/Unsub-High-Sierra-candidate.zip
          if-no-files-found: error
