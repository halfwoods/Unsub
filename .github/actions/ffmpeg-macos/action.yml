name: FFmpeg for macOS
description: >
  Builds the pinned, LGPL-only FFmpeg with LAME and Opus from scripts/build-ffmpeg-macos.sh
  (cached between runs) and points pkg-config at it, so ffmpeg-sys-next links the build that ships.

inputs:
  deployment-target:
    description: Oldest macOS supported by this architecture's app and every bundled library
    required: true

runs:
  using: composite
  steps:
    # Only build tools: LAME, Opus and FFmpeg itself are compiled from the pinned sources.
    - name: Install build tools
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: brew install pkgconf nasm

    - name: Restore FFmpeg build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ffmpeg-prefix
        key: ffmpeg-macos-${{ runner.arch }}-min${{ inputs.deployment-target }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

    - name: Build FFmpeg
      shell: bash
      env:
        MACOSX_DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
      # Returns at once when the cache restored a prefix with a matching build stamp.
      run: scripts/build-ffmpeg-macos.sh "$RUNNER_TEMP/ffmpeg-prefix"

    - name: Point pkg-config at it
      shell: bash
      # opus.pc, which libavcodec.pc requires, is in the same prefix.
      env:
        DEPLOYMENT_TARGET: ${{ inputs.deployment-target }}
      run: |
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg-prefix/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
