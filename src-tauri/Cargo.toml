[package]
name = "unsub"
description = "A music player for people who own their music"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "unsub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
fastrand = "2"
if-addrs = "0.15"
unsub-library.workspace = true
unsub-playback.workspace = true
unsub-ipod.workspace = true
unsub-applemusic.workspace = true
unsub-subsonic.workspace = true
unsub-podcasts.workspace = true
unsub-purchases.workspace = true
unsub-cdrip.workspace = true
unsub-devicesync.workspace = true
unsub-remote.workspace = true
unsub-radio.workspace = true
unsub-visualize.workspace = true
unsub-cast.workspace = true
serde.workspace = true
serde_json.workspace = true

# macOS only: ask for microphone access up front, since a refusal is otherwise just silence.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
