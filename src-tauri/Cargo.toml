[package]
name = "unsub"
description = "A music player for people who own their music"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "unsub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
fastrand = "2"
# How much room a download leaves on the disk; the iPod crates ask the same of it.
fs4 = { version = "1.1.0", features = ["sync"] }
getrandom = "0.3"
if-addrs = "0.15"
# An imported ZIP is unpacked here, and removed when the import is done.
tempfile = "3"
unsub-library.workspace = true
unsub-playback.workspace = true
unsub-ipod.workspace = true
unsub-applemusic.workspace = true
unsub-subsonic.workspace = true
unsub-podcasts.workspace = true
unsub-purchases.workspace = true
unsub-cdrip.workspace = true
unsub-devicesync.workspace = true
unsub-remote.workspace = true
unsub-radio.workspace = true
unsub-visualize.workspace = true
unsub-cast.workspace = true
unsub-elsewhere.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

# macOS only: ask for microphone access up front, since a refusal is otherwise just silence; and read the
# system's choice of what a title-bar double-click does.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
# Test fixtures for a ZIP; the same build purchases already compiles.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
