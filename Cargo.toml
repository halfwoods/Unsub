[workspace]
resolver = "3"
exclude = ["vendor/cpal-0.18.2", "vendor/security-framework-3.7.0"]
members = ["src-tauri", "crates/library", "crates/playback", "crates/ipod", "crates/applemusic", "crates/subsonic", "crates/podcasts", "crates/purchases", "crates/cdrip", "crates/devicesync", "crates/remote", "crates/radio", "crates/visualize", "crates/cast", "crates/elsewhere"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unsub-library = { path = "crates/library" }
unsub-playback = { path = "crates/playback" }
unsub-ipod = { path = "crates/ipod" }
unsub-applemusic = { path = "crates/applemusic" }
unsub-subsonic = { path = "crates/subsonic" }
unsub-podcasts = { path = "crates/podcasts" }
unsub-purchases = { path = "crates/purchases" }
unsub-cdrip = { path = "crates/cdrip" }
unsub-devicesync = { path = "crates/devicesync" }
unsub-remote = { path = "crates/remote" }
unsub-radio = { path = "crates/radio" }
unsub-visualize = { path = "crates/visualize" }
unsub-cast = { path = "crates/cast" }
unsub-elsewhere = { path = "crates/elsewhere" }

# Profiles only take effect at the workspace root. Panics unwind (no `panic = "abort"`) so the audio
# engine can contain a decoder panic on a corrupt file instead of killing the app.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The visualizer analyzes the audio beside playback, and its FFT is generic code that is compiled
# into this crate, so unoptimized it runs at about 30 times real time, not the thousand times it
# manages optimized.
[profile.dev.package.unsub-visualize]
opt-level = 3

# Windows: bindgen overflows the stack of an unoptimised ffmpeg-sys-next build script. Release
# builds leave build scripts unoptimised too unless told otherwise.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Compatibility patches retain the current versions and behavior on newer macOS.
# See vendor/README.md for upstream provenance and the narrowly scoped changes.
[patch.crates-io]
cpal = { path = "vendor/cpal-0.18.2" }
security-framework = { path = "vendor/security-framework-3.7.0" }
