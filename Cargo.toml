[workspace]
resolver = "3"
members = ["src-tauri", "crates/library", "crates/playback", "crates/ipod", "crates/applemusic", "crates/subsonic", "crates/podcasts", "crates/purchases", "crates/cdrip", "crates/devicesync", "crates/remote", "crates/radio", "crates/visualize"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
antistreaming-library = { path = "crates/library" }
antistreaming-playback = { path = "crates/playback" }
antistreaming-ipod = { path = "crates/ipod" }
antistreaming-applemusic = { path = "crates/applemusic" }
antistreaming-subsonic = { path = "crates/subsonic" }
antistreaming-podcasts = { path = "crates/podcasts" }
antistreaming-purchases = { path = "crates/purchases" }
antistreaming-cdrip = { path = "crates/cdrip" }
antistreaming-devicesync = { path = "crates/devicesync" }
antistreaming-remote = { path = "crates/remote" }
antistreaming-radio = { path = "crates/radio" }
antistreaming-visualize = { path = "crates/visualize" }

# Profiles only take effect at the workspace root. Panics unwind (no `panic = "abort"`) so the audio
# engine can contain a decoder panic on a corrupt file instead of killing the app.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The visualizer analyzes the audio beside playback, and its FFT is generic code that is compiled
# into this crate, so unoptimized it runs at about 30 times real time, not the thousand times it
# manages optimized.
[profile.dev.package.antistreaming-visualize]
opt-level = 3

# Windows: bindgen overflows the stack of an unoptimised ffmpeg-sys-next build script.
[profile.dev.build-override]
opt-level = 3
