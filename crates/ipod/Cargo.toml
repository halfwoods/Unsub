[package]
name = "unsub-ipod"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
fs4 = { version = "1.1.0", features = ["sync"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
plist = { version = "1.10.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11.0"
thiserror.workspace = true
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3.27.0"

# Windows only: marking a test file sparse so it can claim more bytes than the disk has.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
