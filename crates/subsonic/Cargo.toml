[package]
name = "unsub-subsonic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
form_urlencoded = "1.2.2"
hex = "0.4.3"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
serde.workspace = true
serde_json.workspace = true
subtle = "2.6.1"
thiserror.workspace = true
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
# The real converter, for one test that streams a fixture through it.
unsub-playback.workspace = true
roxmltree = "0.21.1"
ureq = { version = "3.4.2", default-features = false }
tempfile = "3"
